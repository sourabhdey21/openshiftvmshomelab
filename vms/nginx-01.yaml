apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: nginx-01
  labels:
    app.kubernetes.io/name: nginx-01
    app.kubernetes.io/part-of: gitops-vms
    app.kubernetes.io/managed-by: gitops
    vm-role: web
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: nginx-01-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              # Fedora golden image is ~32Gi; smaller clones fail with DataVolumeError
              storage: 30Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: nginx-01
        app.kubernetes.io/name: nginx-01
        vm-role: web
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 8
        memory:
          guest: 16Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: nginx-01-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: nginx-01
              users:
                - name: cloud-user
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  ssh_authorized_keys:
                    - ssh-ed25519 TODO_REPLACE_WITH_YOUR_PUBLIC_KEY
                  password: $6$rounds=4096$NRQfL3DJxNqkq6Yz$Ch4XG9Vnt8UjZIyW9ba6RCBT2bFz5KiMiGuTQt4BFGSVMXoUAm/vYxG5oiD8VNyMypW8TSjjv0W1FjBEnMH3v.
                  chpasswd: { expire: False }
              runcmd:
                - dnf install -y nginx
                - systemctl enable nginx
                - systemctl start nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-01-lb
spec:
  selector:
    kubevirt.io/domain: nginx-01
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
