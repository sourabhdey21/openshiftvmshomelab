# Copy this file to vms/<name>.yaml, then add it to vms/kustomization.yaml.
# Change every TODO below. Keep the VM name, disk name, and hostname the same.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: TODO-vm-name
  labels:
    app.kubernetes.io/name: TODO-vm-name
    app.kubernetes.io/part-of: gitops-vms
    app.kubernetes.io/managed-by: gitops
spec:
  # Always = start with the VM | Halted = created but powered off
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: TODO-vm-name-rootdisk
      spec:
        # List boot images: oc get datasources -n openshift-virtualization-os-images
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              # Fedora image is ~32Gi. Smaller than 32Gi will cause DataVolumeError.
          # storageClassName: ocs-storagecluster-ceph-rbd
  template:
    metadata:
      labels:
        kubevirt.io/domain: TODO-vm-name
        app.kubernetes.io/name: TODO-vm-name
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: TODO-vm-name-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: TODO-vm-name
              users:
                - name: cloud-user
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  ssh_authorized_keys:
                    - ssh-ed25519 TODO_REPLACE_WITH_YOUR_PUBLIC_KEY
