apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-vms
  namespace: openshift-gitops
spec:
  # Must be 'default': that project lives in the argocd namespace and
  # the Git repo is registered for it. Custom projects belong in namespace argocd.
  project: default
  source:
    # Change this to your Git repo URL after you push.
    repoURL: https://github.com/sourabhdey21/openshiftvmshomelab.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-vms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
